<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 对话内容来自模型，可能包含任何字符。这条 CSP 把网页钉死在本地的
     js/css/font 上：没有远程脚本、没有内联脚本、图片只允许本地与 data:。
     它同时也是"记忆不出设备"这条承诺在渲染层的执行点。 -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src 'self' qrc:;
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: file:;
               font-src 'self' data:;
               connect-src 'self';">
<title>Axo</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="wallpaper" aria-hidden="true"></div>
  <div id="scrim" aria-hidden="true"></div>

  <!-- 预留的 Live2D 容器：现在只是一个空的定位盒子，接入 Cubism SDK 时由
       js/live2d.js 往里面挂 canvas，其余代码不动。 -->
  <div id="live2d-host" aria-hidden="true"></div>

  <header id="topbar">
    <span id="status">正在连接…</span>
  </header>

  <main id="stream" role="log" aria-live="polite" aria-label="对话内容">
    <!-- 空状态。**它住在 #stream 里面**，因为"有没有消息"这个判断只有 stream
         自己知道；但它是常驻节点，清空对话时不能被一起抹掉（见 js/app.js 的
         resetStream）。写在 HTML 里而不是由 JS 生成，是为了让它在任何脚本执行
         之前就已经在页面上——脚本挂了的时候这一句仍然能告诉用户该干什么。 -->
    <p id="empty">说点什么就开始。你说过的会被记进记忆库，换一个模型也还在。</p>

    <!-- 首次使用的人设卡片。它与 #empty 是同一件事的两种形态（"还没有消息时显示
         什么"），所以也住在 #stream 里，也同样不能由 resetStream 抹掉。

         **初值是 hidden，而输入框的初值是能用的**（见 js/app.js 的 personaPending）。
         显隐全由 Python 推上来的 setPersonaState 说了算：
           · 没人设 → 推一次 {asking:true}，卡片打开、输入框在这期间禁用；
           · 有人设 → 同样推一次 {asking:false}，那一次是空操作（卡片本来就藏着）。
         所以卡片默认不能显示：已经定过人设的用户每次启动都会看见它闪一下。

         反过来那条路（默认显示卡片、输入框默认禁用）也想过，否决的理由写在
         js/app.js 的 personaPending 上：接线一断就是"输入框永远点不动"。 -->
    <section id="welcome" hidden>
      <h2>先说清楚我是谁</h2>
      <p class="welcome-note">下面这段是终端本来就带着的，换哪个模型来读都是同一份。
        <b>它不可改</b>——要改它就得改程序。</p>
      <p id="welcome-builtin"></p>
      <label for="persona-input">你想让我怎么说话？这一句是你写的，以后随时能改。</label>
      <textarea id="persona-input" rows="3" autocomplete="off" spellcheck="false"
                placeholder="例如：说话简短直接，不要客套话。叫我小林。"></textarea>
      <div class="welcome-actions">
        <button id="persona-save" type="button" disabled>就这样</button>
        <!-- 「先不写」**不是"永不再问"**，所以两处都要说出来：按钮上悬停有全句，
             下面那一行是给不悬停的人的。第一次用手动验收时，「选了它、重启又问
             一次」被当成 bug 报了上来——那句话此前一个字都没有，界面上的错不在
             行为，在**没说**。 -->
        <button id="persona-skip" type="button"
                title="只是这一次：下次启动还会问你一遍。要它别再问，随便写一句就行。">这一次先不写</button>
      </div>
      <p class="welcome-note" id="welcome-skip-note">选「这一次先不写」只是这一次——下次启动
        还会再问一遍。要它别再问，随便写一句就行，哪怕很短。</p>
      <p class="welcome-note">写下的这段会存进这台机器的记忆库，和上面那段一样：换一个
        模型来读，读到的还是同一份。以后想改，在「设置 → 人设」里改。</p>
    </section>
  </main>

  <section id="call-bar" hidden aria-live="polite">
    <span id="call-state">正在听…</span>
    <span id="call-partial"></span>
    <span id="call-level" title="输入电平"><i></i></span>
    <button id="call-interrupt" type="button" title="停播并开口">插话</button>
    <button id="call-mute" type="button" title="静音">静音</button>
    <button id="call-hangup" type="button" title="挂断">挂断</button>
  </section>

  <section id="sticker-panel" hidden aria-label="表情包">
    <div id="sticker-grid"></div>
    <p id="sticker-empty" hidden>还没有表情包。点「添加图片…」放一张进来。</p>
    <div id="sticker-actions">
      <button id="sticker-add" type="button">添加图片…</button>
      <button id="sticker-folder" type="button">打开文件夹</button>
    </div>
  </section>

  <footer id="composer">
    <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"
              autocomplete="off" spellcheck="false"></textarea>
    <button id="sticker" type="button" title="表情包">表情</button>
    <button id="call" type="button" title="开始通话">通话</button>
    <button id="mic" type="button" title="说一句（按一下开始，再按一下结束）">说话</button>
    <button id="send" type="button" title="发送">发送</button>
  </footer>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="js/live2d.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
