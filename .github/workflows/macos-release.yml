name: macOS 构建

# PyInstaller 不能交叉编译：`.app` 只能在 macOS 上生成。这条腿由 GitHub 的
# macos-15（Apple Silicon）runner 构建，产物作为 artifact 下载；Windows 的
# Release 流水线（tools/build_exe.py）一个字都不动。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*-macos"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_LINK_MODE: copy

jobs:
  build:
    name: macOS arm64（.app / zip / dmg）
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 装依赖（含 PySide6 / vosk / PyInstaller）
        # 钉 3.12 而不是让 runner 选最新：PySide6 的 abi3 wheel 虽然能上 3.14，
        # 但 PyInstaller/vosk 的兼容性没有在 3.14 上验过，构建矩阵该跟 Windows 一致。
        run: uv sync --python 3.12 --locked --all-extras

      - name: 先在 macOS 上跑几条平台相关的守卫
        # QPA 在 runner 上没有显示器；这些文件不建窗口。钥匙串的真通道在下一步单独验。
        run: >
          uv run pytest -p no:pytest-qt
          tests/test_secrets.py tests/test_autostart.py tests/test_paths_root.py
          tests/test_portability.py

      - name: 验证 macOS 钥匙串往返（假 key，写完即删）
        run: |
          uv run python - <<'PY'
          from axo import secrets

          key = "sk-axo-ci-keychain-test"
          assert secrets.is_available(), "macOS 上 security 通道不可用"
          marker = secrets.protect(key)
          assert marker == secrets.KEYCHAIN_MARKER, marker
          assert secrets.unprotect(marker) == key
          assert secrets.protect("") == ""
          assert secrets.unprotect(marker) == ""
          print("keychain round-trip ok")
          PY

      - name: 取随包的中文语音模型（Apache-2.0）
        run: |
          curl -L --fail --retry 5 --retry-delay 5 \
            -o "$RUNNER_TEMP/vosk-model.zip" \
            https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip
          unzip -q "$RUNNER_TEMP/vosk-model.zip" -d "$RUNNER_TEMP/vosk"
          test -d "$RUNNER_TEMP/vosk/vosk-model-small-cn-0.22"

      - name: 构建 .app、ad-hoc 签名、自检、打包
        run: >
          uv run python tools/build_macos.py --release
          --bundle-vosk-model "$RUNNER_TEMP/vosk/vosk-model-small-cn-0.22"

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: axo-macos-arm64
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.sha256
